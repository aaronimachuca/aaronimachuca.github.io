{{ $num_photos := .Params | len }}
{{ $img_counter := 1 }}

<div class="gallery">
  <div class="photo-buttons">
    {{ range $index, $img := .Params }}
      <button 
        class="photo-button" 
        type="button" 
        data-src="{{ $img }}" 
        data-index="{{ $index }}"
        data-number="{{ $img_counter }}"
      >
        <span class="number-img-wrap">
          <img 
            class="number-img number-default"
            src="/images/photo-numbers/{{ $img_counter }}.png" 
            alt="{{ $img_counter }}"
          >
          <img 
            class="number-img number-active"
            src="/images/photo-numbers/{{ $img_counter }}active.png" 
            alt=""
            aria-hidden="true"
          >
        </span>
      </button>
      {{ $img_counter = add $img_counter 1 }}
    {{ end }}

    <button id="prev-photo" class="arrow" type="button">«</button>
    <button id="next-photo" class="arrow" type="button">»</button>
  </div>

  <div class="main-photo">
    <div class="photo-frame">
      <img id="main-photo" src="{{ .Get 0 }}">
    </div>
  </div>
</div>

<script>
  (() => {
    const script = document.currentScript;
    const gallery = script.previousElementSibling;

    document.addEventListener("DOMContentLoaded", () => {
      let currentIndex = 0;

      const mainPhoto = gallery.querySelector("#main-photo");
      const buttons = gallery.querySelectorAll(".photo-button");
      const prev = gallery.querySelector("#prev-photo");
      const next = gallery.querySelector("#next-photo");

      function updateGallery(index, animate = true) {
        const button = buttons[index];
        if (!button) return;

        const newSrc = button.dataset.src;
        currentIndex = index;

        buttons.forEach((btn) => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        if (!animate) {
          mainPhoto.src = newSrc;
          return;
        }

        const preload = new Image();
        preload.src = newSrc;

        preload.onload = () => {
          mainPhoto.classList.add("fade");

          setTimeout(() => {
            mainPhoto.src = newSrc;

            requestAnimationFrame(() => {
              mainPhoto.classList.remove("fade");
            });
          }, 300);
        };
      }

      buttons.forEach((btn, idx) => {
        btn.addEventListener("click", () => {
          updateGallery(idx);
          prev.classList.remove("active");
          next.classList.remove("active");
          btn.blur();
        });
      });

      function shiftImage(dir) {
        const total = buttons.length;
        const newIndex = (currentIndex + dir + total) % total;

        updateGallery(newIndex);
        prev.classList.remove("active");
        next.classList.remove("active");
      }

      prev.addEventListener("click", (e) => {
        shiftImage(-1);
        e.preventDefault();
        prev.blur();
      });

      next.addEventListener("click", (e) => {
        shiftImage(1);
        e.preventDefault();
        next.blur();
      });

      if (buttons.length > 0) {
        updateGallery(0, false);
      }
    });
  })();
</script>
