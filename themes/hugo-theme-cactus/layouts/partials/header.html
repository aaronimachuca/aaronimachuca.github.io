<header id="header" class="ornate-header">
  <div class="ornate-header__canvas">

    <!-- HOME BUTTON -->
    <a href="{{ .Site.BaseURL }}"
       class="home-badge"
       aria-label="Home">

      <img
        src="/images/menu/homeasset.png"
        alt=""
        class="home-badge__frame"
        aria-hidden="true">

      <span
        class="home-badge__icon"
        style="background-image: url(https://i.imgur.com/6p2vUpO.png)">
      </span>
    </a>

    <!-- NAVIGATION -->
    <nav id="nav" class="ornate-nav" aria-label="Main navigation">

      <img
        src="/images/menu/menubar1.png"
        alt=""
        class="ornate-nav__bar ornate-nav__bar--top"
        aria-hidden="true">

      <ul class="ornate-nav__list">
        {{ $currentURL := .RelPermalink }}

        {{ range where .Site.Menus.main "Name" "ne" "Home" }}
          {{ $isCurrent := or (eq $currentURL .URL) (and (ne .URL "/") (hasPrefix $currentURL .URL)) }}
          {{ $base := printf "/images/menu/%s" .Identifier }}

          <li class="ornate-nav__item">
            <a href="{{ .URL }}"
               class="ornate-nav__link{{ if $isCurrent }} is-current{{ end }}"
               {{ if $isCurrent }}aria-current="page"{{ end }}>

              <span class="ornate-nav__image-wrap">
                <img
                  class="ornate-nav__image ornate-nav__image--default"
                  src="{{ printf "%s.png" $base }}"
                  alt="{{ .Name }}">

                <img
                  class="ornate-nav__image ornate-nav__image--active"
                  src="{{ printf "%s-active.png" $base }}"
                  alt=""
                  aria-hidden="true">
              </span>

            </a>
          </li>
        {{ end }}

        <li class="ornate-nav__item ornate-nav__item--hamburger">
          <a href="#" class="ornate-nav__link" aria-label="Menu">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </a>
        </li>
      </ul>

      <img
        src="/images/menu/menubar2.png"
        alt=""
        class="ornate-nav__bar ornate-nav__bar--bottom"
        aria-hidden="true">

    </nav>

  </div>
</header>
